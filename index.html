<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronto</title>

    <link rel="stylesheet" href="./styles/basic.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/menuWrapper.css">
    <link rel="stylesheet" href="./styles/basketWrapper.css">

    <link rel="icon" href="./assets/img/favicon.png" type="image/png">

    <script src="./script.js"></script>
    <script src="./scripts/database.js"></script>
    <script src="./scripts/template.js"></script>

</head>
<body>
    <header>
        <nav>
            <img src="./assets/img/Logo 01.svg">
            <div class="burger_container">
                <div class="burger-menu"></div>
                <div class="burger-menu"></div>
                <div class="burger-menu"></div>
            </div>
        </nav>
    </header>

    <main>
       <section class="wrapper">
            <div class="menu-wrapper">
                <div class="hero-bg">
                    <div>
                        <h1 class="hero-title">PRONTO</h1>
                    </div>
                    <div>
                        <p class="restaurant-score">★★★★☆ (4,5)</p>
                    </div>
                </div>

                <div id="category-selection" class="category-selection">
                </div>

                <div class="category-headline">
                    <h2>${dish.name}</h2>
                </div>
                <div class="menu-container">
                    <div class="menu-card-hero">
                        <img src="./assets/img/col1.jpeg">
                        <div class="menu-info">
                            <h3>Name</h3>
                            <p>Beschreibung:</p>
                        </div>
                    </div>
                    <div class="menu-container">
                        <div class="menu-card-container">
                            <div class="menu-card">
                                <img src="./assets/img/col2.jpeg">
                                <h3>Name</h3>
                                <p>Beschreibung:</p>
                            </div>
                            <div class="menu-card">
                                <img src="./assets/img/col3.jpeg">
                                <h3>Name</h3>
                                <p>Beschreibung:</p>
                            </div>
                        </div>
                    </div>
                </div>
    
                <section id="menu-card" class="menu-card">
                    <div id="-container-Kolumbianisch"></div>
                    <div id="-container-Burger"></div>
                    <div id="-container-Pizza"></div>
                    <div id="-container-Pasta"></div>
                    <div id="-container-Salat"></div>
                    <div id="-container-Getränke"></div>
                </section>
            </div>

            <div class="basket-wrapper">
                <h2>Warenkorb</h2>
            </div>
       </section>
    </main>

    <footer>
        <nav>
            <p>2026 Pronto</p>
            <p>Imprint</p>
            <p>Cookie Preferences</p>
        </nav>
    </footer>

</body>
</html>
